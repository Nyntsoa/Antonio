<section class="section skills-section" id="skills" aria-labelledby="skills-title">
  <header class="section-heading" data-reveal><div><p class="eyebrow">Mes compétences</p><h2 id="skills-title">Les outils de mes idées.</h2></div><p class="section-aside">De l’interface aux données.</p></header>
  <div class="skills-grid">{% for group in skill_groups %}{% if group.names %}<article class="skill-card feature-panel skill-{{ group.key }}" data-reveal><div class="skill-copy"><h3>{{ group.name }}</h3><p>{{ group.description }}</p></div><ul class="skill-list">{% for name in group.names %}<li>{{ name }}</li>{% endfor %}</ul></article>{% endif %}{% endfor %}</div>
</section>
