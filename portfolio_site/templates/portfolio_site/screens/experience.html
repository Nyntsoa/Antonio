<section class="section experience-section" id="experience" aria-labelledby="experience-title">
  <header class="section-heading" data-reveal><div><p class="eyebrow">Mon parcours</p><h2 id="experience-title">Apprendre en faisant.</h2></div><span class="section-aside">La formation rencontre la pratique.</span></header>
  <div class="experience-grid">{% for item in experiences %}<article class="experience-card feature-panel" data-reveal><div class="experience-top"><span class="eyebrow">{{ item.kind }}</span><span class="period">{{ item.period }}</span></div><h3>{{ item.title }}</h3><p class="experience-role">{{ item.role }}</p><p>{{ item.description }}</p><ul class="tool-tags">{% for focus in item.focus %}<li>{{ focus }}</li>{% endfor %}</ul></article>{% endfor %}</div>
</section>
